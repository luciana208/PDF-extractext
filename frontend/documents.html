<!DOCTYPE html>
<html>
<head>
  <title>Documentos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="container mt-5">

<h2> Documentos</h2>

<a href="index.html" class="btn btn-secondary mb-3">← Volver</a>

<table class="table table-bordered">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody id="table-body"></tbody>
</table>

<script type="module">
import { getDocuments, deleteDocument } from "./js/api.js";

async function load() {
  const docs = await getDocuments();
  const tbody = document.getElementById("table-body");
  tbody.innerHTML = "";

  docs.forEach(doc => {
    const row = `
      <tr>
        <td>${doc.name}</td>
        <td>
          <a href="detail.html?id=${doc.id}" class="btn btn-info btn-sm">Ver</a>
          <button class="btn btn-danger btn-sm" onclick="deleteDoc('${doc.id}')">Eliminar</button>
        </td>
      </tr>
    `;
    tbody.innerHTML += row;
  });
}

window.deleteDoc = async (id) => {
  await deleteDocument(id);
  load();
};

load();
</script>

</body>
</html>
