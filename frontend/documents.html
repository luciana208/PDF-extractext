<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentos — PDF Extractext</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <nav class="topbar">
    <a href="index.html" class="topbar-brand">
      <div class="brand-icon">📄</div>
      PDF Extractext
    </a>
    <div class="topbar-nav">
      <a href="index.html">Inicio</a>
      <a href="documents.html" class="active">Documentos</a>
      <a href="upload.html">Subir</a>
    </div>
  </nav>

  <div class="page-wrapper">
    <div class="page-header">
      <div class="eyebrow">// repositorio</div>
      <h1>Documentos</h1>
      <p>Todos los PDFs almacenados con su texto extraído.</p>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
      <span id="count-label" style="font-family:var(--mono);font-size:.78rem;color:var(--text-muted);">Cargando…</span>
      <a href="upload.html" class="btn btn-success">↑ Subir nuevo</a>
    </div>

    <div id="table-container">
      <div class="empty-state">
        <div class="empty-icon"><span class="spinner"></span></div>
      </div>
    </div>
  </div>

<script type="module">
import { getDocuments, deleteDocument } from "./js/api.js";

async function load() {
  const container = document.getElementById("table-container");
  const countLabel = document.getElementById("count-label");

  try {
    const docs = await getDocuments();
    countLabel.textContent = `${docs.length} documento${docs.length !== 1 ? 's' : ''}`;

    if (docs.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <p>No hay documentos todavía.</p>
          <a href="upload.html" class="btn btn-success">↑ Subir el primero</a>
        </div>`;
      return;
    }

    const rows = docs.map(doc => `
      <tr>
        <td>
          <span style="font-weight:600;color:var(--white)">${doc.name}</span>
        </td>
        <td style="font-family:var(--mono);font-size:.75rem;color:var(--text-muted)">
          ${doc.id ? doc.id.slice(-8) : '—'}
        </td>
        <td>
          <div class="table-actions">
            <a href="detail.html?id=${doc.id}" class="btn btn-info btn-sm">Ver</a>
            <button class="btn btn-danger btn-sm" onclick="deleteDoc('${doc.id}')">Eliminar</button>
          </div>
        </td>
      </tr>
    `).join('');

    container.innerHTML = `
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>ID</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  } catch (err) {
    countLabel.textContent = '';
    container.innerHTML = `
      <div class="alert alert-error">
        ✕ No se pudo conectar con la API. Verificá que el servidor esté corriendo.
      </div>`;
  }
}

window.deleteDoc = async (id) => {
  if (!confirm('¿Eliminar este documento?')) return;
  try {
    await deleteDocument(id);
    load();
  } catch (err) {
    alert('Error al eliminar: ' + err.message);
  }
};

load();
</script>

</body>
</html>
