<!DOCTYPE html>
<html>
<head>
  <title>Subir PDF</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h2> Subir PDF</h2>

<a href="index.html" class="btn btn-secondary mb-3">← Volver</a>

<form id="form">
  <div class="mb-3">
    <input type="file" class="form-control" id="file" required>
  </div>

  <div class="mb-3">
    <input type="text" class="form-control" id="name" placeholder="Nombre opcional">
    <link rel="stylesheet" href="./css/styles.css">
  </div>

  <button class="btn btn-success">Subir</button>
</form>

<div id="msg" class="mt-3"></div>

<script type="module">
import { uploadDocument } from "./js/api.js";

document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();

  const file = document.getElementById("file").files[0];
  const name = document.getElementById("name").value;

  try {
    await uploadDocument(file, name);
    document.getElementById("msg").innerHTML = "✅ Subido correctamente";
  } catch (err) {
    document.getElementById("msg").innerHTML = "❌ " + err.message;
  }
};
</script>

</body>
</html>
