<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subir PDF — PDF Extractext</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <nav class="topbar">
    <a href="index.html" class="topbar-brand">
      <div class="brand-icon">📄</div>
      PDF Extractext
    </a>
    <div class="topbar-nav">
      <a href="index.html">Inicio</a>
      <a href="documents.html">Documentos</a>
      <a href="upload.html" class="active">Subir</a>
    </div>
  </nav>

  <div class="page-wrapper">
    <div class="page-header">
      <div class="eyebrow">// nuevo documento</div>
      <h1>Subir PDF</h1>
      <p>Seleccioná un archivo PDF para extraer su contenido y almacenarlo.</p>
    </div>

    <div class="card" style="max-width: 540px;">
      <div class="form-group">
        <label class="form-label" for="file">Archivo PDF</label>
        <input type="file" class="form-control" id="file" accept=".pdf" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="name">Nombre personalizado <span style="color:var(--text-dim)">(opcional)</span></label>
        <input type="text" class="form-control" id="name" placeholder="ej. informe-final-2024">
      </div>

      <div class="divider"></div>

      <button class="btn btn-success btn-lg" id="submit-btn" onclick="handleUpload()">
        ↑ Subir documento
      </button>
    </div>

    <div id="msg" class="mt-3"></div>
  </div>

<script type="module">
import { uploadDocument } from "./js/api.js";

window.handleUpload = async function () {
  const file = document.getElementById("file").files[0];
  const name = document.getElementById("name").value;
  const btn  = document.getElementById("submit-btn");
  const msg  = document.getElementById("msg");

  if (!file) {
    msg.innerHTML = '<div class="alert alert-error">⚠ Seleccioná un archivo PDF primero.</div>';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Procesando…';
  msg.innerHTML = '';

  try {
    await uploadDocument(file, name);
    msg.innerHTML = `
      <div class="alert alert-success">
        ✓ Documento subido correctamente.
        <a href="documents.html" style="color:inherit;margin-left:8px;text-decoration:underline">Ver documentos →</a>
      </div>`;
    document.getElementById("file").value = '';
    document.getElementById("name").value = '';
  } catch (err) {
    msg.innerHTML = `<div class="alert alert-error">✕ ${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '↑ Subir documento';
  }
};
</script>

</body>
</html>
