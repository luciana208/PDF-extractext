<!DOCTYPE html>
<html>
<head>
  <title>Detalle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="container mt-5">

<h2>📄 Detalle del documento</h2>

<a href="documents.html" class="btn btn-secondary mb-3">← Volver</a>

<div id="content"></div>

<script type="module">
import { getDocument } from "./js/api.js";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function load() {
  const doc = await getDocument(id);

  document.getElementById("content").innerHTML = `
    <h4>${doc.name}</h4>
    <p><strong>Checksum:</strong> ${doc.checksum}</p>
    <pre style="white-space: pre-wrap;">${doc.extracted_text}</pre>
  `;
}

load();
</script>

</body>
</html>
