version: '3.8'

services:
  app:
    build: .
    container_name: pdf_extract_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongo
    networks:
      - backend

  mongo:
    image: mongo:6
    container_name: pdf_extract_mongo
    env_file:
      - .env
    volumes:
      - mongo_data:/data/db
    networks:
      - backend

volumes:
  mongo_data:

networks:
  backend:
    driver: bridge
